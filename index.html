<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChatWithHistory</title>
<style>
:root{--bg:#f4ecd8;--card:#fbf6e9;--ink:#2b2118;--mute:#7a6a55;--accent:#8b2e1f;--line:#d9c9a5;--meink:#fff7ea;--cur:#7a1f1f;--cur2:#a83232;--wall:#efe2c0;--wall2:#cdb88a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1712;--card:#27201a;--ink:#eadfc9;--mute:#a39478;--accent:#d9885f;--line:#40362b;--meink:#fff3e4;--cur:#5a1616;--cur2:#802626;--wall:#4a3c2b;--wall2:#2a2218;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1712;--card:#27201a;--ink:#eadfc9;--mute:#a39478;--accent:#d9885f;--line:#40362b;--meink:#fff3e4;--cur:#5a1616;--cur2:#802626;--wall:#4a3c2b;--wall2:#2a2218;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding:16px 14px 36px}
h1{font-size:clamp(1.5rem,5vw,2.1rem);margin:.2em 0 .6em;text-align:center;color:var(--accent)}
.lang{display:flex;gap:4px;justify-content:flex-end}.lang button{padding:5px 11px;font-size:.8rem;background:transparent;color:var(--accent);border:1px solid var(--accent)}.lang button.on{background:var(--accent);color:var(--meink)}
.stage{position:relative;height:min(84vh,660px);border-radius:14px;overflow:hidden;border:3px solid var(--line);background:radial-gradient(ellipse at 50% 30%,var(--wall),var(--wall2));display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.floor{position:absolute;left:0;right:0;bottom:0;height:56px;background:repeating-linear-gradient(90deg,#8a5a34 0 44px,#7a4d2b 44px 88px);box-shadow:inset 0 8px 14px rgba(0,0,0,.35)}
.cloud{position:relative;z-index:2;width:min(84%,520px);margin:0 0 62px}
.cb{position:absolute;inset:0;filter:drop-shadow(2.5px 0 0 #2b2118) drop-shadow(-2.5px 0 0 #2b2118) drop-shadow(0 2.5px 0 #2b2118) drop-shadow(0 -2.5px 0 #2b2118)}
.cb i{position:absolute;background:#fffdf5;border-radius:50%}
.cb i.bd{inset:0;border-radius:40px}
.ct{position:relative;padding:20px 28px;max-height:min(26vh,220px);overflow-y:auto;color:#2b2118;font-size:1.02rem;white-space:pre-wrap;text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:70px}
.ct span{display:block;margin:auto 0}
.who{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:4;font-size:.85rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 14px;white-space:nowrap}
.who:empty{display:none}
#char{position:relative;z-index:3;margin-bottom:-4px}
svg.ch{display:block;width:min(46vw,210px);height:auto}
.curt{position:absolute;top:0;bottom:0;width:51%;z-index:5;transition:transform 1s ease-in-out;background:repeating-linear-gradient(90deg,var(--cur) 0 18px,var(--cur2) 18px 36px);box-shadow:inset 0 0 40px rgba(0,0,0,.45)}
.curt.l{left:0;transform:translateX(-100%)}.curt.r{right:0;transform:translateX(100%)}
.stage.closed .curt{transform:translateX(0)}
.val{position:absolute;top:0;left:0;right:0;height:26px;z-index:6;background:linear-gradient(var(--cur2),var(--cur));border-bottom:3px solid #d9a93a}
.talk{animation:bob .5s infinite alternate ease-in-out}
@keyframes bob{to{transform:translateY(-4px)}}
.talk .mouth{animation:tk .22s infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes tk{to{transform:scaleY(.3)}}
.eye{animation:bl 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.row{display:flex;gap:8px;margin-top:12px}
input{flex:1;min-width:0;font:inherit;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{font:inherit;padding:10px 16px;border:0;border-radius:8px;background:var(--accent);color:var(--meink);cursor:pointer}
button:disabled{opacity:.5}
button.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.note{text-align:center;color:var(--mute);font-size:.8rem;margin-top:12px}
.last{color:var(--mute);font-size:.85rem;margin-top:8px;text-align:right;min-height:1.2em}
</style>
</head>
<body>
<div class="wrap">
  <div class="lang"><button data-l="az">AZ</button><button data-l="en">EN</button><button data-l="ru">RU</button></div>
  <h1 id="h1">⏳ ChatWithHistory</h1>
  <div class="stage" id="stage">
    <div class="floor"></div>
    <div class="cloud" id="cloud">
      <div class="cb"><i class="bd"></i>
        <i style="left:2%;top:-26px;width:26%;height:62px"></i><i style="left:22%;top:-38px;width:28%;height:74px"></i><i style="left:46%;top:-42px;width:30%;height:80px"></i><i style="left:70%;top:-28px;width:28%;height:64px"></i>
        <i style="left:4%;bottom:-24px;width:28%;height:56px"></i><i style="left:28%;bottom:-30px;width:30%;height:62px"></i><i style="left:54%;bottom:-26px;width:28%;height:56px"></i><i style="left:74%;bottom:-22px;width:26%;height:52px"></i>
        <i style="left:-18px;top:16%;width:60px;height:66%"></i><i style="right:-18px;top:16%;width:60px;height:66%"></i>
        <i style="left:calc(50% - 10px);bottom:-44px;width:26px;height:22px"></i><i style="left:calc(50% + 12px);bottom:-60px;width:15px;height:13px"></i>
      </div>
      <div class="ct" id="ct"><span id="tx">…</span></div>
    </div>
    <div id="char"></div>
    <div class="who" id="who"></div>
    <div class="curt l"></div><div class="curt r"></div><div class="val"></div>
  </div>
  <div class="last" id="last"></div>
  <div class="row"><input id="inp" placeholder="Şəxsiyyətin adını yazın…" autocomplete="off"><button id="btn">Göndər</button><button class="alt" id="back" title="Başqa şəxsiyyət">↺</button></div>
  <p class="note" id="warn">Cavablar süni intellekt tərəfindən canlandırılır və tam dəqiq olmaya bilər.</p>
</div>
<script>

 az:{title:"⏳ ChatWithHistory",greet:"Salam! Bu gün hansı şəxsiyyətlə görüşmək istərdiniz?",ph1:"Şəxsiyyətin adını yazın…",ph2:"Sualınızı yazın…",send:"Göndər",back:"Başqa şəxsiyyət",note:"Cavablar süni intellekt tərəfindən canlandırılır və tam dəqiq olmaya bilər.",noai:"Süni intellekt bu görünüşdə əlçatan deyil. Səhifəni claude.ai hesabınızla açın.",you:"Siz: ",unk:"Bağışlayın, bu adı tarixi şəxsiyyət kimi tanımadım. Başqa ad deyin.",denied:"İcazə verilmədi. Yenidən cəhd edin.",rate:"Çox sorğu göndərildi, bir az gözləyin.",err:"Xəta baş verdi. Yenidən cəhd edin."},

const M=p.mustache==="thin"?`<path d="M104 125 Q120 118 136 125 Q120 123 104 125Z" fill="${H}" stroke="${H}" stroke-width="2.5"/>`:p.mustache==="thick"?`<path d="M100 127 Q108 116 120 122 Q132 116 140 127 Q130 131 120 127 Q110 131 100 127Z" fill="${H}"/>`:p.mustache==="long"?`<path d="M100 125 Q110 116 120 122 Q130 116 140 125 Q146 142 138 152 Q136 134 120 129 Q104 134 102 152 Q94 142 100 125Z" fill="${H}"/>`:"";
f+=`<ellipse class="mouth" cx="120" cy="135" rx="8" ry="3.6" fill="#7a2a2a"/>`+M;
f+=`<path d="M92 90 Q104 84 114 89 M126 89 Q136 84 148 90" stroke="${H}" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;
f+=[105,135].map(x=>`<g class="eye"><ellipse cx="${x}" cy="100" rx="5.4" ry="3.6" fill="#fff"/><circle cx="${x}" cy="100" r="2.7" fill="#3a2a22"/><circle cx="${x+1}" cy="99" r=".9" fill="#fff"/></g>`).join("");
if(p.glasses)f+=`<g stroke="#222" stroke-width="2.5" fill="rgba(255,255,255,.18)"><circle cx="105" cy="100" r="11"/><circle cx="135" cy="100" r="11"/><path d="M116 100 H124 M94 98 L84 96 M146 98 L156 96"/></g>`;
return f}
function draw(p,talk){const arm=(x,m)=>`<path d="M${x} 210 Q${x+m*28} 256 ${x+m*2} 284" stroke="${p.robe}" stroke-width="30" fill="none" stroke-linecap="round"/>`;
$("char").innerHTML=`<svg class="ch ${talk?"talk":""}" id="svg" viewBox="0 0 240 300" role="img" aria-label="Aparıcı">${outfit(p)}${arm(44,-1)}${arm(196,1)}<circle cx="46" cy="288" r="11" fill="${p.skin}"/>${item(p)}<circle cx="194" cy="286" r="11" fill="${p.skin}"/><rect x="106" y="146" width="28" height="30" fill="${sh(p.skin,-.12)}"/>${face(p)}${hat(p)}</svg>`}
function setTalk(on){const s=$("svg");if(s)s.classList.toggle("talk",on)}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function curtain(close){$("stage").classList.toggle("closed",close);await wait(1050)}
function show(t,talk){$("tx").textContent=t;$("ct").scrollTop=1e9;setTalk(!!talk)}
function norm(j){return{name:String(j.name||"").slice(0,60),years:String(j.years||"").slice(0,30),persona:String(j.persona||"").slice(0,700),greeting:String(j.greeting||"").slice(0,400),robe:c(j.robe,"#5b6b8c"),trim:c(j.trim,"#e0b030"),skin:c(j.skin,"#e8c39e"),hair:c(j.hair,"#3a2a22"),hatc:c(j.hatc,"#3a2a22"),beard:w(j.beard,["none","short","long","pointed"],"none"),mustache:w(j.mustache,["none","thin","thick","long"],"none"),hairstyle:w(j.hairstyle,["bald","balding","short","long"],"short"),age:w(j.age,["young","mid","old"],"mid"),outfit:w(j.outfit,OUT,"robe"),hat:w(j.hat,HATS,"none"),item:w(j.item,ITEMS,"none"),glasses:j.glasses===true,valid:j.valid!==false}}
async function summon(name){
const p="Kimsə tarixi şəxsiyyətlə görüşmək istəyir: «"+name+"». Yalnız JSON qaytar, başqa heç nə yazma. Sahələr: valid (real tarixi şəxsiyyətdirsə true, deyilsə və ya tanımırsansa false), name (tam ad, "+LN[lang]+" dilində), latin (adın latın əlifbası ilə ingiliscə yazılışı), years (həyat illəri), persona (2-3 cümlə: kim idi, hansı dövrdə yaşayıb, danışıq üslubu), greeting (həmin şəxsin öz üslubunda "+LN[lang]+" dilində 1-2 cümləlik salam və özünü təqdim), robe, trim, skin, hair, hatc (hex #rrggbb: geyimin əsas rəngi, haşiyə, dəri, saç və saqqal, baş geyiminin rəngi), hairstyle (bald, balding, short, long), beard (none, short, long, pointed), mustache (none, thin, thick, long), age (young, mid, old), glasses (true/false), outfit (robe, coat, armor, tunic, cloak), hat (none, crown, turban, kulah, papaq, laurel, beret, helmet, hood, bicorn, fez, tophat, tall), item (none, scroll, sword, book, quill, globe, staff). Görünüş şəxsin tarixi portretlərdəki, miniatürlərdəki və ya fotolardakı tanınmış obrazına, dövrünə və mədəniyyətinə mümkün qədər yaxın olsun.";
const raw=await sample.json(p,{cache:false,signal:ctrl.signal});const j=norm(raw);const k=(j.name+" "+name+" "+String(raw.latin||"")).toLowerCase();for(const[re,v]of PRE)if(re.test(k)){Object.assign(j,v);break}return j}
async function onSend(){const t=$("inp").value.trim();if(!t||busy)return;
if(!sample){$("warn").textContent=T("noai");return}
$("inp").value="";busy=true;$("btn").disabled=true;ctrl=new AbortController();$("last").textContent=T("you")+t;
try{if(mode==="pick"){
 $("cloud").style.visibility="hidden";setTalk(false);await curtain(true);
 let p;try{p=await summon(t)}catch(e){await curtain(false);$("cloud").style.visibility="visible";throw e}
 if(!p.valid||!p.name){draw(MED,false);$("who").textContent="";$("cloud").style.visibility="visible";await curtain(false);show(T("unk"),true);await wait(1800);setTalk(false)}
 else{prof=p;hist=[];greet=p.greeting||"Salam!";draw(p,false);$("who").textContent=p.name+(p.years?" · "+p.years:"");$("cloud").style.visibility="visible";await curtain(false);mode="chat";show(greet,true);await wait(Math.min(2500,greet.length*45));setTalk(false);$("inp").placeholder=T("ph2")}
}else{
 hist.push({role:"user",content:t});show("…");
 const pre="Sən "+prof.name+" rolunu oynayırsan. "+prof.persona+" Qaydalar: "+LN[lang]+" dilində, birinci şəxsdə, öz dövrünün ruhunda və danışıq tərzində cavab ver. Yalnız tarixən bilinən faktlara əsaslan, bilmədiyini uydurma. Dövrdən sonrakı şeylər sənə naməlumdur, maraqla qarşıla. 2-5 cümlə yaz. Rolu pozma. Artıq salamlaşmısan: «"+greet+"».\n\nİstifadəçi ilə söhbət:\n";
 const msgs=hist.map((h,i)=>i===0?{role:"user",content:pre+h.content}:h);
 try{const r=await sample(msgs,{cache:false,signal:ctrl.signal,onText:({text})=>show(text,true)});show(r.text,false);hist.push({role:"assistant",content:r.text})}catch(e){hist.pop();throw e}
}}catch(e){setTalk(false);show(e&&e.code==="not_granted"?T("denied"):e&&e.code==="rate_limited"?T("rate"):T("err"))}
busy=false;$("btn").disabled=false;$("inp").focus()}
async function reset(){if(busy)return;busy=true;if(ctrl)ctrl.abort();$("cloud").style.visibility="hidden";await curtain(true);prof=MED;mode="pick";hist=[];draw(MED,false);$("who").textContent="";$("last").textContent="";$("inp").placeholder=T("ph1");$("cloud").style.visibility="visible";await curtain(false);show(T("greet"),true);await wait(1800);setTalk(false);busy=false;$("btn").disabled=false}
$("btn").onclick=onSend;$("back").onclick=reset;$("inp").addEventListener("keydown",e=>{if(e.key==="Enter")onSend()});
draw(MED,true);applyLang();show(T("greet"),true);setTimeout(()=>setTalk(false),1800);document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
async function callApi(messages,signal){const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages}),signal});if(!r.ok){const e=new Error("api");e.code=r.status===429?"rate_limited":"error";throw e}return(await r.json()).text}
sample=async(m,o={})=>{const t=await callApi(m,o.signal);if(o.onText)o.onText({text:t});return{text:t}};
sample.json=async(p,o={})=>{const t=await callApi([{role:"user",content:p}],o.signal);return JSON.parse(t.replace(/```json|```/g,"").trim())};
</script>
